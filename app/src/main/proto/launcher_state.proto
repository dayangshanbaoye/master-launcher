syntax = "proto3";
package launcher;

option java_package = "com.rubyketang.launcher.data.proto";
option java_multiple_files = true;

// 索引快照 + frecency 事件（含设备信号）+ 用户覆盖/别名 + 提议状态，全部一个文件。
message TargetProto {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated string aliases = 4;
  repeated string tags = 5;
  string icon_uri = 6;
  string launch_uri = 7;
}

message UsageEventProto {
  int64 at = 1;
  int32 signals = 2;  // ContextSignals 的信号位掩码（P1-5）
}

message UsageEventsProto {
  repeated UsageEventProto events = 1;
}

message StringListProto {
  repeated string values = 1;
}

// 05-product-spec.md §2.3 推荐簇迟滞状态，对应 RecommendedClusterPolicy 的单槽状态。
message RecommendedSlotStateProto {
  string challenger_id = 1;   // 空字符串表示当前没有在计数的挑战者
  int64 last_checked_day = 2;
  int32 streak_days = 3;
}

message LauncherStateProto {
  repeated TargetProto targets = 1;
  map<string, UsageEventsProto> usage = 2;
  reserved 3;                                          // 原单值 tag_overrides，§3.2.2 多归属后由字段 15 取代
  map<string, string> gestures = 4;
  repeated string pins = 5;
  map<string, StringListProto> user_aliases = 6;       // P1-4
  reserved 7, 8;                                       // 原 P1-3 手势提议字段，随四角对角滑一起移除（05-product-spec.md 附）
  map<string, int64> dnd_hidden_until = 9;             // P2-2：分类临时隐藏截止时间
  bool sync_enabled = 10;                              // P2-3：仅在用户明确发起同步后开启
  map<int32, string> fixed_slots = 11;                 // §2.3：固定簇，key 是槽位 0..3，缺失 = 空槽
  map<int32, RecommendedSlotStateProto> recommended_slot_state = 12; // §2.3：推荐簇迟滞状态，key 是槽位 0..3
  map<string, int64> recommendation_excluded_until = 13; // §2.3：长按推荐槽"排除"，30 天内不再推荐
  map<int32, string> recommended_occupants = 14;       // §2.3：推荐簇当前在位者，key 是槽位 0..3，缺失 = 空槽
  map<string, StringListProto> tag_overrides = 15;     // §3.2.2/§3.2.3：条目 → 手动分类集合（多归属），取代字段 3
  repeated string custom_categories = 16;              // §3.2.3：用户自建分类，上限 8 个
}
